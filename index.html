<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gym Tracker Pro - Manual & Auto Guide</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --accent: #2f81f7;
      --green: #238636;
      --red: #da3633;
      --text: #c9d1d9;
      --text-white: #f0f6fc;
      --subtext: #8b949e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 90px; }

    header {
      background: var(--card);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .header-user-row { display: flex; gap: 8px; align-items: center; }

    .container { max-width: 600px; margin: 0 auto; padding: 14px; }

    .nav-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
    .tab-btn {
      flex: 1;
      padding: 9px 8px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--subtext);
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .splits-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; }
    .split-pill {
      background: #21262d;
      border: 1px solid var(--border);
      color: var(--subtext);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .split-pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .card {
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 14px;
      margin-bottom: 14px;
    }
    .card-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      color: var(--text-white);
      font-size: 0.95rem;
    }

    .set-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .set-table th { color: var(--subtext); padding: 6px 4px; text-align: center; font-size: 0.75rem; }
    .set-table td { padding: 6px 4px; text-align: center; }
    
    input, select {
      background: #0d1117;
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 6px;
      padding: 8px;
      font-size: 0.85rem;
      text-align: center;
      width: 100%;
    }
    input:focus, select:focus { border-color: var(--accent); outline: none; }

    .check-btn {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-weight: bold;
    }
    .check-btn.checked { background: var(--green); border-color: var(--green); color: #fff; }

    .action-btn-group {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .action-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: 1px dashed var(--accent);
      color: var(--accent);
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .action-btn.primary {
      background: #21262d;
      border-style: solid;
      color: #fff;
    }

    .guide-btn {
      background: #21262d;
      border: 1px solid var(--border);
      color: #58a6ff;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.75rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* Modal Form & Guide */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 500;
      justify-content: center;
      align-items: center;
      padding: 14px;
    }
    .modal-content {
      background: var(--card);
      width: 100%;
      max-width: 480px;
      max-height: 85vh;
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      overflow-y: auto;
    }

    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--subtext);
      margin-bottom: 4px;
      text-align: left;
    }
    .form-group input, .form-group select {
      text-align: left;
    }

    .guide-img-box {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 10px;
      border: 1px solid var(--border);
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 200px;
    }
    .guide-img-box img {
      width: 100%;
      max-height: 250px;
      object-fit: contain;
    }
    .guide-video-box {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      margin-top: 10px;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }
    .guide-video-box iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    #timer-bar {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #161b22;
      border-top: 2px solid var(--accent);
      padding: 12px 20px;
      justify-content: space-between;
      align-items: center;
      z-index: 200;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div>
        <h1 style="font-size: 1.1rem; color: var(--text-white);">Gym Tracker Pro</h1>
        <div style="font-size: 0.75rem; color: var(--subtext);" id="session-summary">Volume: 0 kg | Selesai: 0 set</div>
      </div>
      <button onclick="finishWorkout()" style="background: var(--accent); border:none; color:#fff; padding:6px 14px; border-radius:6px; font-weight:bold; cursor:pointer;">Selesai Sesi</button>
    </div>
    <div class="header-user-row">
      <span style="font-size: 0.8rem; color: var(--subtext); white-space: nowrap;">Profil:</span>
      <select id="user-select" onchange="switchUser(this.value)" style="flex: 1; text-align: left; padding: 6px 8px;"></select>
      <button onclick="addUserPrompt()" style="background: #21262d; border: 1px solid var(--border); color: #fff; padding: 6px 10px; border-radius: 6px; cursor: pointer;">+ User</button>
    </div>
  </header>

  <div class="container">
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('workout')">Latihan</button>
      <button class="tab-btn" onclick="switchTab('history')">Riwayat</button>
    </div>

    <!-- TAB WORKOUT -->
    <div id="tab-workout">
      <div class="splits-bar" id="splits-container"></div>
      <div id="exercise-list"></div>
      
      <!-- Action Buttons Tambah Gerakan -->
      <div class="action-btn-group">
        <button class="action-btn primary" onclick="openManualAddModal()">✏️ Tambah Gerakan Manual</button>
        <button class="action-btn" onclick="addExerciseWithAutoSearch()">⚡ Cepat (Auto-Search)</button>
      </div>
    </div>

    <!-- TAB HISTORY -->
    <div id="tab-history" style="display: none;">
      <div class="card">
        <div class="card-title">Riwayat Sesi: <span id="history-user-label" style="color: var(--accent);"></span></div>
        <div id="history-list" style="font-size: 0.85rem; color: var(--subtext);">Belum ada riwayat sesi.</div>
      </div>
    </div>
  </div>

  <!-- MODAL TAMBAH GERAKAN SECARA MANUAL -->
  <div class="modal-backdrop" id="manual-add-modal">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <strong style="color: var(--text-white); font-size: 1.1rem;">Tambah Gerakan Baru</strong>
        <button onclick="closeManualAddModal()" style="background: none; border: none; color: var(--subtext); font-size: 1.3rem; cursor: pointer;">✕</button>
      </div>

      <div class="form-group">
        <label>Nama Gerakan *</label>
        <input type="text" id="manual-name" placeholder="Misal: Incline Dumbbell Press" required />
      </div>

      <div class="form-group">
        <label>Target Otot (Opsional)</label>
        <input type="text" id="manual-muscle" placeholder="Misal: Dada Atas, Triceps" />
      </div>

      <div class="form-group">
        <label>Link Gambar / GIF Panduan (Opsional)</label>
        <input type="url" id="manual-img" placeholder="https://example.com/panduan.gif" />
      </div>

      <div class="form-group">
        <label>ID / Link YouTube Video (Opsional)</label>
        <input type="text" id="manual-yt" placeholder="Misal: rT7DgCr-3pg atau link video YouTube" />
      </div>

      <div style="margin-top: 10px; display: flex; gap: 8px;">
        <button onclick="submitManualExercise()" style="flex: 1; padding: 12px; background: var(--green); border: none; color: #fff; border-radius: 8px; font-weight: bold; cursor: pointer;">
          Simpan Gerakan
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL PANDUAN OTOMATIS & VISUAL -->
  <div class="modal-backdrop" id="guide-modal">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <strong id="guide-title" style="color: var(--text-white); font-size: 1.1rem;">Panduan Gerakan</strong>
        <button onclick="closeGuideModal()" style="background: none; border: none; color: var(--subtext); font-size: 1.3rem; cursor: pointer;">✕</button>
      </div>

      <div id="guide-muscle-info" style="font-size: 0.8rem; color: var(--subtext);"></div>

      <!-- Video Embed Box jika ada link Youtube spesifik -->
      <div class="guide-video-box" id="guide-video-container" style="display: none;">
        <iframe id="guide-video-iframe" src="" allowfullscreen></iframe>
      </div>

      <!-- Preview Gambar / GIF -->
      <div class="guide-img-box" id="guide-img-container">
        <div id="guide-loading" style="color: var(--subtext); font-size: 0.85rem;">Mencari visual otomatis...</div>
        <img id="guide-img-preview" src="" style="display: none;" alt="Preview gerakan" />
      </div>

      <div style="margin-top: 14px; display: flex; flex-direction: column; gap: 8px;">
        <a id="guide-yt-tutorial" target="_blank" style="text-align: center; background: #ff0000; color: #fff; text-decoration: none; padding: 10px; border-radius: 8px; font-size: 0.85rem; font-weight: 600;">
          ▶ Tonton Video Tutorial di YouTube ↗
        </a>
        <a id="guide-yt-shorts" target="_blank" style="text-align: center; background: #21262d; border: 1px solid var(--border); color: #fff; text-decoration: none; padding: 8px; border-radius: 8px; font-size: 0.8rem;">
          📱 Cari Shorts Tutorial ↗
        </a>
      </div>
    </div>
  </div>

  <!-- Rest Timer Widget -->
  <div id="timer-bar">
    <div>
      <span style="font-size: 0.8rem; color: var(--subtext);">Istirahat: </span>
      <strong id="timer-display" style="font-size: 1.1rem; color: var(--text-white);">01:30</strong>
    </div>
    <button onclick="stopTimer()" style="background: var(--red); border:none; color:#fff; padding:6px 12px; border-radius:6px; font-weight:bold; cursor:pointer;">Lewati</button>
  </div>

  <script>
    const defaultSplits = ["Push", "Pull", "Legs", "Upper Body", "Lower Body"];
    let users = JSON.parse(localStorage.getItem("gym_users")) || ["Kevin", "Partner"];
    let currentUser = localStorage.getItem("gym_current_user") || users[0];
    let currentSplit = "Push";
    let userWorkoutData = {};
    let timerInterval = null;
    let secondsLeft = 90;

    let visualCache = JSON.parse(localStorage.getItem("gym_visual_cache")) || {};

    function init() {
      loadUserRoutine();
      populateUserDropdown();
      renderSplitsBar();
      renderCurrentWorkout();
    }

    function populateUserDropdown() {
      const select = document.getElementById("user-select");
      select.innerHTML = users.map(u => `<option value="${u}" ${u === currentUser ? 'selected' : ''}>${u}</option>`).join("");
    }

    function switchUser(u) {
      currentUser = u;
      localStorage.setItem("gym_current_user", currentUser);
      loadUserRoutine();
      renderCurrentWorkout();
      loadHistory();
    }

    function addUserPrompt() {
      const name = prompt("Nama pengguna baru:");
      if (name && !users.includes(name.trim())) {
        users.push(name.trim());
        localStorage.setItem("gym_users", JSON.stringify(users));
        switchUser(name.trim());
        populateUserDropdown();
      }
    }

    function loadUserRoutine() {
      const saved = localStorage.getItem(`gym_routine_${currentUser}`);
      if (saved) {
        userWorkoutData = JSON.parse(saved);
      } else {
        userWorkoutData = {
          "Push": [{ name: "Barbell Bench Press", sets: [{ type: "N", prev: "-", weight: 40, reps: 10, done: false }] }],
          "Pull": [{ name: "Lat Pulldown", sets: [{ type: "N", prev: "-", weight: 35, reps: 12, done: false }] }],
          "Legs": [{ name: "Barbell Squat", sets: [{ type: "N", prev: "-", weight: 50, reps: 8, done: false }] }],
          "Upper Body": [],
          "Lower Body": []
        };
      }
    }

    function saveUserRoutine() {
      localStorage.setItem(`gym_routine_${currentUser}`, JSON.stringify(userWorkoutData));
    }

    function renderSplitsBar() {
      const bar = document.getElementById("splits-container");
      bar.innerHTML = defaultSplits.map(s => `
        <button class="split-pill ${s === currentSplit ? 'active' : ''}" onclick="changeSplit('${s}')">${s}</button>
      `).join("");
    }

    function changeSplit(s) {
      currentSplit = s;
      renderSplitsBar();
      renderCurrentWorkout();
    }

    function renderCurrentWorkout() {
      const container = document.getElementById("exercise-list");
      container.innerHTML = "";
      const exercises = userWorkoutData[currentSplit] || [];

      exercises.forEach((ex, exIndex) => {
        const card = document.createElement("div");
        card.className = "card";

        let setsRows = ex.sets.map((s, sIndex) => `
          <tr>
            <td style="width: 12%;">${sIndex + 1}</td>
            <td style="width: 20%;">
              <select onchange="updateSet(${exIndex}, ${sIndex}, 'type', this.value)">
                <option value="N" ${s.type === 'N' ? 'selected' : ''}>Norm</option>
                <option value="W" ${s.type === 'W' ? 'selected' : ''}>Warm</option>
                <option value="D" ${s.type === 'D' ? 'selected' : ''}>Drop</option>
                <option value="F" ${s.type === 'F' ? 'selected' : ''}>Fail</option>
              </select>
            </td>
            <td style="color: var(--subtext); width: 20%;">${s.prev}</td>
            <td style="width: 18%;">
              <input type="number" value="${s.weight}" onchange="updateSet(${exIndex}, ${sIndex}, 'weight', this.value)">
            </td>
            <td style="width: 18%;">
              <input type="number" value="${s.reps}" onchange="updateSet(${exIndex}, ${sIndex}, 'reps', this.value)">
            </td>
            <td style="width: 12%;">
              <button class="check-btn ${s.done ? 'checked' : ''}" onclick="toggleSet(${exIndex}, ${sIndex})">✓</button>
            </td>
          </tr>
        `).join("");

        card.innerHTML = `
          <div class="card-title">
            <div style="display:flex; align-items:center; gap:8px;">
              <strong>${ex.name}</strong>
              <button class="guide-btn" onclick="openExerciseGuide('${ex.name}')">👁 Panduan</button>
            </div>
            <button onclick="removeExercise(${exIndex})" style="background:none; border:none; color:var(--red); cursor:pointer;">Hapus</button>
          </div>
          <table class="set-table">
            <thead>
              <tr><th>SET</th><th>TIPE</th><th>LALU</th><th>KG</th><th>REPS</th><th>OK</th></tr>
            </thead>
            <tbody>${setsRows}</tbody>
          </table>
          <button class="action-btn" onclick="addSet(${exIndex})">+ Tambah Set</button>
        `;
        container.appendChild(card);
      });

      calculateTotals();
    }

    // FORM MODAL TAMBAH GERAKAN MANUAL
    function openManualAddModal() {
      document.getElementById("manual-name").value = "";
      document.getElementById("manual-muscle").value = "";
      document.getElementById("manual-img").value = "";
      document.getElementById("manual-yt").value = "";
      document.getElementById("manual-add-modal").style.display = "flex";
    }

    function closeManualAddModal() {
      document.getElementById("manual-add-modal").style.display = "none";
    }

    function extractYouTubeId(url) {
      if (!url) return "";
      const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      return match ? match[1] : url.trim();
    }

    function submitManualExercise() {
      const name = document.getElementById("manual-name").value.trim();
      const muscle = document.getElementById("manual-muscle").value.trim();
      const img = document.getElementById("manual-img").value.trim();
      const ytRaw = document.getElementById("manual-yt").value.trim();

      if (!name) {
        alert("Nama gerakan wajib diisi!");
        return;
      }

      // Masukkan ke routine pengguna
      if (!userWorkoutData[currentSplit]) userWorkoutData[currentSplit] = [];
      userWorkoutData[currentSplit].push({
        name: name,
        sets: [{ type: "N", prev: "-", weight: 0, reps: 10, done: false }]
      });

      // Simpan metadata visual jika diisi
      if (img || ytRaw || muscle) {
        visualCache[name.toLowerCase()] = {
          image: img || "",
          youtubeId: extractYouTubeId(ytRaw),
          info: `Target: ${muscle || currentSplit}`
        };
        localStorage.setItem("gym_visual_cache", JSON.stringify(visualCache));
      }

      saveUserRoutine();
      closeManualAddModal();
      renderCurrentWorkout();
    }

    // Auto-Search Instan
    function addExerciseWithAutoSearch() {
      const name = prompt("Ketik nama gerakan (contoh: Dumbbell Fly, Bulgarian Split Squat):");
      if (!name || !name.trim()) return;

      const cleanName = name.trim();
      if (!userWorkoutData[currentSplit]) userWorkoutData[currentSplit] = [];
      userWorkoutData[currentSplit].push({
        name: cleanName,
        sets: [{ type: "N", prev: "-", weight: 0, reps: 10, done: false }]
      });

      saveUserRoutine();
      renderCurrentWorkout();
      openExerciseGuide(cleanName);
    }

    // Modal Panduan
    async function openExerciseGuide(exerciseName) {
      const modal = document.getElementById("guide-modal");
      const title = document.getElementById("guide-title");
      const muscleInfo = document.getElementById("guide-muscle-info");
      const imgContainer = document.getElementById("guide-img-container");
      const imgPreview = document.getElementById("guide-img-preview");
      const loading = document.getElementById("guide-loading");
      const videoBox = document.getElementById("guide-video-container");
      const videoIframe = document.getElementById("guide-video-iframe");
      const ytLink = document.getElementById("guide-yt-tutorial");
      const shortsLink = document.getElementById("guide-yt-shorts");

      title.innerText = exerciseName;
      modal.style.display = "flex";

      const q = encodeURIComponent(`${exerciseName} form workout technique`);
      ytLink.href = `https://www.youtube.com/results?search_query=${q}`;
      shortsLink.href = `https://www.youtube.com/results?search_query=${encodeURIComponent(exerciseName + ' shorts form workout')}`;

      // Reset view
      videoBox.style.display = "none";
      videoIframe.src = "";
      imgPreview.style.display = "none";
      imgContainer.style.display = "flex";
      loading.style.display = "block";
      loading.innerText = "Mencari visual...";

      // 1. Cek Data Manual / Cache
      const cached = visualCache[exerciseName.toLowerCase()];
      if (cached) {
        muscleInfo.innerText = cached.info || `Kategori: ${currentSplit}`;

        if (cached.youtubeId) {
          videoIframe.src = `https://www.youtube-nocookie.com/embed/${cached.youtubeId}`;
          videoBox.style.display = "block";
          if (!cached.image) {
            imgContainer.style.display = "none";
            return;
          }
        }
        if (cached.image) {
          imgPreview.src = cached.image;
          imgPreview.style.display = "block";
          loading.style.display = "none";
          return;
        }
      }

      // 2. Fetch dari Repositori Terbuka jika belum ada link manual
      try {
        const searchWord = exerciseName.toLowerCase().replace(/[^a-z0-9]/g, ' ');
        const res = await fetch(`https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises.json`);
        
        if (res.ok) {
          const list = await res.json();
          const matched = list.find(item => 
            item.name.toLowerCase().includes(searchWord) || 
            searchWord.includes(item.name.toLowerCase())
          );

          if (matched && matched.images && matched.images.length > 0) {
            const imgUrl = `https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/${matched.images[0]}`;
            imgPreview.src = imgUrl;
            imgPreview.style.display = "block";
            loading.style.display = "none";

            const infoStr = `Target: ${matched.primaryMuscles?.join(', ') || '-'} | Level: ${matched.level || '-'}`;
            muscleInfo.innerText = infoStr;

            visualCache[exerciseName.toLowerCase()] = { image: imgUrl, info: infoStr };
            localStorage.setItem("gym_visual_cache", JSON.stringify(visualCache));
            return;
          }
        }
      } catch (err) {}

      loading.innerHTML = `
        <div style="padding: 20px; text-align: center;">
          <p style="color: var(--text-white); font-weight: 600; margin-bottom: 4px;">Tutorial Siap di YouTube</p>
          <span style="font-size:0.8rem; color:var(--subtext);">Klik tombol merah di bawah untuk menonton panduan gerakan.</span>
        </div>
      `;
      muscleInfo.innerText = "Kategori: " + currentSplit;
    }

    function closeGuideModal() {
      document.getElementById("guide-modal").style.display = "none";
      document.getElementById("guide-video-iframe").src = "";
    }

    function updateSet(exIdx, setIdx, field, val) {
      userWorkoutData[currentSplit][exIdx].sets[setIdx][field] = field === 'type' ? val : Number(val);
      saveUserRoutine();
      calculateTotals();
    }

    function toggleSet(exIdx, setIdx) {
      const set = userWorkoutData[currentSplit][exIdx].sets[setIdx];
      set.done = !set.done;
      if (set.done) startTimer(90);
      saveUserRoutine();
      renderCurrentWorkout();
    }

    function addSet(exIdx) {
      const sets = userWorkoutData[currentSplit][exIdx].sets;
      const last = sets[sets.length - 1] || { weight: 0, reps: 10 };
      sets.push({ type: "N", prev: `${last.weight}kg x ${last.reps}`, weight: last.weight, reps: last.reps, done: false });
      saveUserRoutine();
      renderCurrentWorkout();
    }

    function removeExercise(idx) {
      if (confirm("Hapus latihan ini?")) {
        userWorkoutData[currentSplit].splice(idx, 1);
        saveUserRoutine();
        renderCurrentWorkout();
      }
    }

    function startTimer(duration) {
      clearInterval(timerInterval);
      secondsLeft = duration;
      const bar = document.getElementById("timer-bar");
      const display = document.getElementById("timer-display");
      bar.style.display = "flex";

      timerInterval = setInterval(() => {
        secondsLeft--;
        const m = Math.floor(secondsLeft / 60).toString().padStart(2, '0');
        const s = (secondsLeft % 60).toString().padStart(2, '0');
        display.innerText = `${m}:${s}`;
        if (secondsLeft <= 0) {
          clearInterval(timerInterval);
          bar.style.display = "none";
        }
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      document.getElementById("timer-bar").style.display = "none";
    }

    function calculateTotals() {
      let totalVolume = 0;
      let completedSets = 0;
      const list = userWorkoutData[currentSplit] || [];

      list.forEach(ex => {
        ex.sets.forEach(s => {
          if (s.done) {
            completedSets++;
            totalVolume += (s.weight * s.reps);
          }
        });
      });

      document.getElementById("session-summary").innerText = 
        `Volume: ${totalVolume} kg | Selesai: ${completedSets} set`;
    }

    function finishWorkout() {
      const list = userWorkoutData[currentSplit] || [];
      let totalVol = 0;
      let count = 0;
      list.forEach(ex => ex.sets.forEach(s => {
        if (s.done) { count++; totalVol += (s.weight * s.reps); }
      }));

      if (count === 0) {
        alert("Belum ada set yang dicentang hari ini.");
        return;
      }

      const dateStr = new Date().toLocaleDateString("id-ID", { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
      const record = `${dateStr} [${currentSplit}] — ${count} Set | Volume: ${totalVol} kg`;
      
      let savedHist = JSON.parse(localStorage.getItem(`gym_hist_${currentUser}`) || "[]");
      savedHist.unshift(record);
      localStorage.setItem(`gym_hist_${currentUser}`, JSON.stringify(savedHist));

      list.forEach(ex => ex.sets.forEach(s => s.done = false));
      saveUserRoutine();
      renderCurrentWorkout();
      loadHistory();
      alert(`Sesi [${currentSplit}] selesai dan tersimpan ke riwayat!`);
    }

    function loadHistory() {
      document.getElementById("history-user-label").innerText = currentUser;
      const saved = JSON.parse(localStorage.getItem(`gym_hist_${currentUser}`) || "[]");
      const list = document.getElementById("history-list");
      list.innerHTML = saved.length === 0 ? "Belum ada riwayat sesi." : saved.map(i => `<div style="padding:6px 0; border-bottom:1px solid var(--border);">${i}</div>`).join("");
    }

    function switchTab(tab) {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.getElementById("tab-workout").style.display = tab === 'workout' ? 'block' : 'none';
      document.getElementById("tab-history").style.display = tab === 'history' ? 'block' : 'none';
      event.target.classList.add("active");
      if (tab === 'history') loadHistory();
    }

    init();
  </script>
</body>
</html>
